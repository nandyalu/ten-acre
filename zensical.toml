[project]
site_name = "Ten Acre"
site_url = "https://nandyalu.github.io/ten-acre/"
site_description = "An autonomous AI agent trading a simulated account with $10,000. It picks what to research, pays for it, and every decision it makes is on the record."
repo_url = "https://github.com/nandyalu/ten-acre"
repo_name = "nandyalu/ten-acre"
# Zensical's own default points "edit this page" at the master branch —
# this repo's default branch is main, so it has to be stated explicitly
# or every edit link 404s.
edit_uri = "edit/main/docs/"
copyright = """
Self-hosted docs · not financial advice
"""

nav = [
  { "Home" = "index.md" },
  { "The journey" = "journey.md" },
  { "Changelog" = "changelog.md" },
  { "Contributing" = "contributing.md" },
  { "Using AI on this project" = "ai-policy.md" },
  { "The two-book experiment" = "two-book-experiment.md" },
  { "The analyst experiment" = "analyst-experiment.md" },
  { "Run it yourself" = "deploying.md" },
  { "Credentials" = "setup.md" },
  { "How it works" = "overview.md" },
  { "The site" = "dashboard.md" },
  { "Notifications" = "discord.md" },
  { "Reading the experiment" = "trading-workflow.md" },
  { "Reading the scorecard" = "finding-your-edge.md" },
  { "Making a small model work" = "model-training.md" },
  { "The GPU pool" = "gpu-pool.md" },
  { "Running a bigger model" = "gpu-bigger-models.md" },
  { "How many analyses at once" = "gpu-concurrency.md" },
  { "Google's free tier (not built)" = "free-tier-gemini.md" },
]

[project.theme]
language = "en"
# The mark, and the tab icon. logo-dark, not logo-mono: the header renders it
# as an <img>, and currentColor inside an SVG loaded that way resolves to
# black rather than inheriting the header ink. The header bar is dark in both
# palettes, so the light-ink file is the one that shows.
logo = "assets/logo.svg"
favicon = "assets/favicon.svg"
features = [
    "content.code.copy",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.sections",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
