# Builds the release that a machine without Docker installs.
#
# On a v* tag: the dashboard and the docs are built into the backend package,
# the package is built as a wheel, the TradingAgents fork is built as a second
# wheel because it is not on PyPI, and uv.lock is exported as a constraints
# file so the install resolves the same versions the Docker image does. The
# files go into one zip on the GitHub release. docs/deploying.md, under
# "Without Docker", says how to install it.
name: Release

on:
  push:
    tags: ["v*"]
  # So a failed build can run again on the same tag, without a new tag.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The tag names the release and pyproject.toml names the wheel. They
      # must agree, or a wheel called 0.1.0 sits on a release called v0.2.0.
      - name: Check that the tag matches pyproject.toml
        run: |
          version="$(uv version --short)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "pyproject.toml says ${version}; the tag says ${GITHUB_REF_NAME}"
            exit 1
          fi

      # angular.json's outputPath is ../backend/web.
      - name: Build the dashboard
        working-directory: frontend
        run: npm ci && npm run build

      # Pinned, the same as docs.yml. zensical.toml's site_dir is backend/site.
      - name: Build the docs
        run: uvx zensical==0.0.59 build

      - name: Build the wheels and the constraints file
        run: |
          uv build --wheel --out-dir dist
          uv build --wheel TradingAgents --out-dir "$PWD/dist"
          uv export --no-dev --no-hashes --no-emit-project --no-emit-package tradingagents --no-header -o dist/constraints.txt
          cp .env.example dist/
          ls -la dist

      # The same command a user runs, into a scratch location, then one real
      # start: the migration runs, and the dashboard and the docs answer.
      - name: Install the result and start it once
        run: |
          export UV_TOOL_DIR="$RUNNER_TEMP/tools" UV_TOOL_BIN_DIR="$RUNNER_TEMP/bin"
          uv tool install ten-acre --find-links dist --constraints dist/constraints.txt
          mkdir -p "$RUNNER_TEMP/data"
          TEN_ACRE_DATA_DIR="$RUNNER_TEMP/data" API_PORT=8971 "$RUNNER_TEMP/bin/ten-acre" > "$RUNNER_TEMP/run.log" 2>&1 &
          pid=$!
          if ! timeout 120 sh -c 'until curl -sf localhost:8971/api/settings >/dev/null; do sleep 2; done'; then
            cat "$RUNNER_TEMP/run.log"
            exit 1
          fi
          curl -sf -o /dev/null localhost:8971/
          curl -sf -o /dev/null localhost:8971/docs/
          test -f "$RUNNER_TEMP/data/trading.db"
          kill "$pid"

      - name: Zip the release
        run: |
          mkdir "ten-acre-${GITHUB_REF_NAME}"
          cp dist/*.whl dist/constraints.txt dist/.env.example "ten-acre-${GITHUB_REF_NAME}/"
          zip -r "ten-acre-${GITHUB_REF_NAME}.zip" "ten-acre-${GITHUB_REF_NAME}"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip="ten-acre-${GITHUB_REF_NAME}.zip"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$zip" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$zip" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
