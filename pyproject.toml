[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ten-acre"
version = "0.2.0"
description = "Discord bot + web dashboard delegating stock analysis to TradingAgents"
requires-python = ">=3.14"
# PolyForm Noncommercial 1.0.0 has no SPDX identifier — it isn't an
# OSI-approved open-source license — so this points at the LICENSE file
# itself rather than asserting an SPDX expression that doesn't exist.
license = { file = "LICENSE" }
dependencies = [
    "tradingagents",
    "python-dotenv>=1.0.0",
    "sqlmodel>=0.0.24",
    "alembic>=1.15.0",
    "webull-openapi-python-sdk>=2.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "quiv>=0.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

# The command an installed copy gets. main() loads .env, brings the database
# schema up to date, then serves. The container runs the same function through
# `python -m backend.main`.
[project.scripts]
ten-acre = "backend.main:main"

[tool.uv.sources]
tradingagents = { path = "TradingAgents", editable = false }

# The wheel is what `uv tool install` installs, and it is the whole app: the
# backend package with the built dashboard (backend/web) and the built docs
# (backend/site) inside it. Both are gitignored build outputs, and hatch skips
# ignored files unless they are named as artifacts, so build both before
# `uv build --wheel`. The release workflow does; see docs/deploying.md.
[tool.hatch.build.targets.wheel]
packages = ["backend"]
exclude = ["backend/tests"]
artifacts = ["backend/web/**", "backend/site/**"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
